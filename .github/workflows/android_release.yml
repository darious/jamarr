name: Android Release

# android-v* only. This used to fire on every v* tag, so a backend-only
# release rebuilt and republished the APK unchanged.
on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1

      - name: Install Android SDK packages
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" 2>&1 | tail -5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The tag is the version. versionCode must be a monotonic integer, so it
      # is derived from the same semver: 1.8.0 -> 10800.
      - name: Derive version from tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#android-v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF_NAME must look like android-vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PjamarrVersionName=${{ steps.version.outputs.name }} \
            -PjamarrVersionCode=${{ steps.version.outputs.code }}

      # Cheap insurance: the whole point is that the APK stops disagreeing with
      # the tag, so fail the release if it somehow still does.
      - name: Verify APK version
        run: |
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | head -1)"
          badging="$("$aapt2" dump badging app/build/outputs/apk/release/app-release.apk | head -1)"
          echo "$badging"
          grep -q "versionName='${{ steps.version.outputs.name }}'" <<<"$badging"
          grep -q "versionCode='${{ steps.version.outputs.code }}'" <<<"$badging"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/jamarr.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: android/app/build/outputs/apk/release/jamarr.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
