music_path: "/app/music/"

musicbrainz:
  root_url: "https://musicbrainz.org"
  rate_limit: "none"

qobuz:
  region: "gb-en"

logging:
  level: "INFO"
  rotation:
    max_bytes: 10485760 # 10MB
    backup_count: 5

# Scanner concurrency
max_workers: 16

# Audio analysis (loudness/ReplayGain/BPM) — used by the `audio-analysis`
# scanner command and the "Audio Analysis (All Phases)" scheduled job.
# Omit a key to keep the built-in default.
audio_analysis:
  batch_size: 25 # DB rows selected per batch
  concurrency: 2 # ffmpeg analyses run at once
  timeout_seconds: 600 # per-track ffmpeg timeout

# UPnP renderers fetch streams/art via a header-recasing proxy on this port
# (uvicorn lowercases response headers; some renderers need canonical casing).
# Env override: RENDERER_PROXY_PORT.
renderer:
  stream_proxy_port: 8112

pearlarr: {}
