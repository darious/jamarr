music_path: "/app/music/"

musicbrainz:
  root_url: "https://musicbrainz.org"
  rate_limit: "none"

qobuz:
  region: "gb-en"

logging:
  level: "INFO"
  rotation:
    max_bytes: 10485760 # 10MB
    backup_count: 5

# Scanner concurrency
max_workers: 16

# Audio analysis (loudness/ReplayGain/BPM) — used by the `audio-analysis`
# scanner command and the "Audio Analysis (All Phases)" scheduled job.
# Omit a key to keep the built-in default.
audio_analysis:
  batch_size: 25 # DB rows selected per batch
  concurrency: 2 # ffmpeg analyses run at once
  timeout_seconds: 600 # per-track ffmpeg timeout

# Artwork resizing (/api/art/file/{sha1}?max_size=N). Resizes run on their own
# small thread pool; each one holds a reduced decode of the source plus the
# output, so this bounds peak image memory. Env override: ART_RESIZE_WORKERS.
artwork:
  resize_workers: 2

# UPnP renderers fetch streams/art via a header-recasing proxy on this port
# (uvicorn lowercases response headers; some renderers need canonical casing).
# Env override: RENDERER_PROXY_PORT.
renderer:
  stream_proxy_port: 8112
  # LAN address UPnP discovery binds to and advertises in stream URLs.
  # Unset = default-route address. Env override: UPNP_SOURCE_IP.
  # upnp_source_ip: 192.168.1.50
  # Next-track staging (SetNextAVTransportURI) for renderers that advertise
  # it. A renderer that faults on the action is switched off automatically
  # until restart; list UDNs here to pin the choice.
  # upnp_gapless:
  #   enabled: true          # false = never stage, on any renderer
  #   disabled_udns: []      # never stage on these
  #   forced_udns: []        # stage even if not advertised
  # UPnP event subscriptions (AVTransport/RenderingControl LastChange): the
  # renderer NOTIFYs a callback server bound to the source address above on
  # this port. Events off = 1 s polling. Env overrides: UPNP_EVENTS,
  # UPNP_EVENT_PORT.
  # upnp_events: true
  # upnp_event_port: 8113
  # Per-device audio output constraints for output planning (see
  # docs/architecture/renderers.md#audio-output-planning). Keys: renderer id
  # (upnp:/cast: prefix optional), UPnP UDN or Cast UUID. Device quirks are
  # opt-in, never global.
  # audio_constraints:
  #   "cast:<uuid>":
  #     flac_max_block_size: 4608  # receivers that need fixed FLAC blocks <= 4608
  #     max_sample_rate_hz: 96000
  #   "uuid:<udn>":
  #     max_bit_depth: 16
  #     max_channels: 2
  #     prefer_wav: true           # decode to WAV rather than FLAC
  #     allow_lossy: false         # never fall back to MP3/Opus
  # Server Cast: queue the next track on the receiver (QUEUE_INSERT with a
  # preloadTime) so it can fetch it before the current one ends, instead of a
  # fresh LOAD per track. Off by default (transition silence unmeasured).
  # cast_queue:
  #   enabled: false         # true = every Cast device
  #   enabled_uuids: []      # or just these (Cast device UUIDs)
  #   disabled_uuids: []     # never on these
  #   preload_seconds: 20

pearlarr: {}
